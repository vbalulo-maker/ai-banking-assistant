name: Deploy to GitHub Pages

on.push.branches: [main]

on.workflow_dispatch: {} (пустой объект, чтобы можно было запускать вручную)

permissions: contents: read, pages: write, id-token: write

concurrency.group: "pages"

concurrency.cancel-in-progress: false

jobs.deploy.environment.name: github-pages

jobs.deploy.environment.url: ${{ steps.deployment.outputs.page_url }}

jobs.deploy.runs-on: ubuntu-latest

steps (по порядку):

uses: actions/checkout@v4
uses: actions/setup-node@v4, with: { node-version: 20, cache: 'npm' }
run: npm ci
run: npm run build
uses: actions/upload-pages-artifact@v3, with: { path: './dist' }
uses: actions/deploy-pages@v4, id: deployment